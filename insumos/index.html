<body>
  <div id="nav-placeholder"></div>

  <!-- CONTENIDO -->
  <div class="pagina-wrapper">

    <div class="pagina-header">
      <h1>Insumos 🪣</h1>
      <p>Materiales y herramientas para ceramistas. Consultanos por precios y disponibilidad.</p>
    </div>

    <!-- SECCIONES DE INSUMOS (la pestaña del Laboratorio aparece sola cuando hay fichas publicadas) -->
    <div class="ins-tabs" id="insTabs" role="tablist" style="display:none">
      <button type="button" class="ins-tab activo" id="insTabCatalogo" role="tab" aria-selected="true">🪣 Catálogo</button>
      <button type="button" class="ins-tab" id="insTabLab" role="tab" aria-selected="false">🧪 Laboratorio de Materiales</button>
    </div>

    <!-- CATÁLOGO -->
    <div id="insumosCatalogo">

    <!-- BUSCADOR -->
    <div class="buscador-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="buscadorInsumos" class="buscador-input" placeholder="Buscar por nombre...">
    </div>

    <!-- FILTRO POR CATEGORÍA -->
    <div class="filtros" id="filtros">
      <button class="filtro activo" data-categoria="todas">Todas</button>
    </div>

    <!-- ESTADO DE CARGA -->
    <div class="estado" id="estado">
      <div class="spinner"></div>
      <p>Cargando insumos...</p>
    </div>

    <!-- GRID DE INSUMOS -->
    <div class="piezas-grid" id="insumosGrid"></div>

    </div><!-- /insumosCatalogo -->

    <!-- LABORATORIO DE MATERIALES -->
    <div id="insumosLaboratorio" style="display:none">
      <p class="ins-lab-intro">Fichas técnicas y pruebas de los materiales de YCA Cerámica. Si escaneaste el QR de un envase, tu material está en esta lista.</p>
      <div id="insumosLabListado"></div>
    </div>

  </div>
